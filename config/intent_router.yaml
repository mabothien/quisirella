# Quisirella — Hybrid Intent Router (Phase A + B semantic shortlist)
# Phase B: python -m quisirella index-intents → route-intent "..."

version: 1

guards:
  always_block_if_contains:
    - "bo qua rule"
    - "bỏ qua rule"
    - "ignore previous"
    - "ignore all instructions"
    - "ads_create"
    - "ads_update"
    - "ads_activate"
    - "ads_delete"
    - "ads_manage"
  force_intent_if_contains:
    skip_refresh:
      - "skip refresh"
      - "khong fetch"
      - "không fetch"
      - "dung refresh"
      - "dừng refresh"
    save_session:
      - "luu phien"
      - "lưu phiên"
      - "luu phien"
      - "checkpoint"
      - "save session"

ambiguous_pairs:
  - [finance_lookup, meta_lookup]
  - [ads_analysis, full_business]
  - [finance_lookup, full_business]

intents:
  finance_lookup:
    description: "Tra cứu doanh thu, lợi nhuận, số đơn từ Google Sheet — không cần Meta"
    examples:
      - "lợi nhuận tháng 7"
      - "doanh thu tháng 6"
      - "tháng này kiếm được bao nhiêu"
      - "lãi bao nhiêu"
      - "bán được mấy đơn"
      - "số đơn tháng này"
    pipeline:
      - finance-fetcher
    output_mode: chat_short
    skip_auto_refresh: true
    period_default: current_month

  meta_lookup:
    description: "Tra cứu chi phí quảng cáo, spend, tin nhắn — Meta only"
    examples:
      - "chi phí quảng cáo tháng này"
      - "spend bao nhiêu"
      - "tiền ads"
      - "tin nhắn bao nhiêu"
      - "chi phí tin nhắn"
    pipeline:
      - meta-fetcher-or-read-output
    output_mode: chat_short
    skip_auto_refresh: true
    period_default: current_month

  ads_analysis:
    description: "Phân tích campaign ACTIVE, verdict, funnel DM — không bắt buộc Sheet"
    examples:
      - "campaign phễu có ổn không"
      - "tin nhắn đắt quá"
      - "phân tích quảng cáo"
      - "chi phí tin nhắn campaign phễu"
      - "retarget sao rồi"
    pipeline:
      - meta-fetcher
      - meta-analyst
    output_mode: chat_analysis
    skip_auto_refresh: false
    may_update:
      - output/06-active-campaigns-analysis.md

  full_business:
    description: "Phân tích kinh doanh + quảng cáo đầy đủ — Sheet + Meta"
    examples:
      - "phân tích tình hình kinh doanh"
      - "phân tích tình hình hoạt động"
      - "quảng cáo có đáng tiền không"
      - "quang cao co dang tien khong xet loi nhuan sheet"
      - "phan tich tinh hinh kinh doanh va quang cao thang 7"
      - "tong hop doanh thu sheet meta spend ROAS that"
      - "tình hình tháng này sao rồi"
      - "báo cáo tổng tháng"
    pipeline:
      - finance-fetcher
      - meta-fetcher
      - meta-analyst
      - report-writer
    output_mode: reports_and_chat
    skip_auto_refresh: false
    parallel_fetch: true
    may_update:
      - output/01-meta-ads-performance.md
      - output/02-audience-insights.md
      - output/03-finance-summary.md
      - output/04-relevance-notes.md
      - output/05-recommendations.md
      - output/06-active-campaigns-analysis.md

  ig_organic_copy:
    description: "Viết caption Story/Post IG organic — không fetch data"
    examples:
      - "viết caption story"
      - "viết caption post"
      - "caption organic Tiffany"
      - "viết lại caption IG"
    pipeline:
      - rule-quisirella-ig-organic-copy
    output_mode: chat_caption
    skip_auto_refresh: true

  cached_read:
    description: "Đọc báo cáo có sẵn khi data < 12h — không fetch"
    examples:
      - "số vừa phân tích"
      - "kết quả hôm qua"
      - "báo cáo mới nhất"
      - "đọc lại phân tích"
    pipeline:
      - read-output-06-or-01
    output_mode: chat_short
    skip_auto_refresh: true
    requires_fresh_data_hours: 12

  save_session:
    description: "User chủ động lưu checkpoint phiên — ghi output/09"
    examples:
      - "lưu phiên"
      - "luu phien"
      - "checkpoint"
      - "save session"
    pipeline:
      - write-checkpoint-09
    output_mode: checkpoint_only
    skip_auto_refresh: true

  ambiguous:
    description: "Không đủ chắc intent — hỏi lại 1 câu"
    pipeline:
      - ask-clarification
    output_mode: chat_question

pipeline_notes:
  finance-fetcher: "python -m quisirella fetch-finance --month YYYY-MM"
  meta-fetcher-or-read-output: "Đọc output/01 hoặc 06 nếu refresh <12h; else meta-fetcher MCP"
  write-checkpoint-09: "Append template vào output/09-session-checkpoints.md — xem quisirella-session-memory.mdc"
  parallel_fetch: "finance-fetcher + meta-fetcher song song cùng calendar month"

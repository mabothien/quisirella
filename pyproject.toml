[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "quisirella"
version = "0.1.0"
description = "Multi-agent system for Quisirella - secondhand luxury jewelry store on Instagram. Collects Meta Ads + Google Sheets data and exports Markdown knowledge files for Claude Projects."
requires-python = ">=3.11"
dependencies = [
    "langchain>=1.3.11",
    "langgraph>=1.2.7",
    "langchain-anthropic>=1.4.8",
    "langchain-mcp-adapters>=0.3.0",
    "mcp>=1.28.1",
    "google-api-python-client>=2.198.0",
    "google-auth>=2.55.1",
    "pyyaml>=6.0.3",
    "python-dotenv>=1.2.2",
    "chromadb>=0.6.0",
    "langchain-chroma>=0.2.0",
    "langchain-huggingface>=0.1.0",
    "sentence-transformers>=3.0.0",
    "rank_bm25>=0.2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
]

[project.scripts]
quisirella = "quisirella.main:main"

[tool.setuptools.packages.find]
where = ["src"]
